plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.raul'
version = '0.0.1-SNAPSHOT'
description = 'java-web-scarper'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'com.microsoft.playwright:playwright:1.52.0'
    implementation 'org.jsoup:jsoup:1.18.3'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('playwrightInstall', JavaExec) {
    group = 'playwright'
    description = 'Installs Playwright Chromium browser binaries for local scraper development.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args 'install', 'chromium'
}

tasks.register('xAuthState', JavaExec) {
    group = 'playwright'
    description = 'Creates a reusable X Playwright storage state from environment credentials.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.raul.javawebscarper.tools.xauth.XAuthStateGenerator'
    standardInput = System.in
}

tasks.register('xAuthStateInteractive', JavaExec) {
    group = 'playwright'
    description = 'Opens X login in headed Chromium and saves storage state after manual authentication.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.raul.javawebscarper.tools.xauth.XAuthStateGenerator'
    args '--interactive-only'
    standardInput = System.in
}

tasks.register('facebookAuthStateInteractive', JavaExec) {
    group = 'authentication'
    description = 'Creates Facebook Playwright storage state using interactive login.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.raul.javawebscarper.tools.facebookauth.FacebookAuthStateGenerator'
    standardInput = System.in
}

tasks.register('instagramAuthStateInteractive', JavaExec) {
    group = 'authentication'
    description = 'Creates Instagram Playwright storage state using interactive login.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.raul.javawebscarper.tools.instagramauth.InstagramAuthStateGenerator'
    standardInput = System.in
}

tasks.register('tiktokAuthStateInteractive', JavaExec) {
    group = 'authentication'
    description = 'Creates TikTok Playwright storage state using interactive login.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.raul.javawebscarper.tools.tiktokauth.TikTokAuthStateGenerator'
    standardInput = System.in
}
