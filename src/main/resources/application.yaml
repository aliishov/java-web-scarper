spring:
  config:
    import: optional:file:${SOCIAL_AUTH_SECRETS_FILE:./local/auth/social-auth.local.properties}
  application:
    name: ${SPRING_APPLICATION_NAME:java-web-scarper}

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  main:
    banner-mode: off

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:scarper_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:true}
        default_schema: core
    open-in-view: false

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    schemas: ${DB_SCHEMA:core}
    default-schema: ${DB_SCHEMA:core}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,flyway
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

server:
  port: ${SERVER_PORT:8080}

security:
  jwt:
    secret: ${JWT_SECRET:local-development-jwt-secret-change-before-production}
    issuer: ${JWT_ISSUER:java-web-scarper}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:30d}

scraper:
  auth:
    # Social sessions are managed from the protected admin UI. Do not open browsers merely on app startup.
    bootstrap-enabled: ${SOCIAL_AUTH_BOOTSTRAP_ENABLED:false}
    fail-startup-if-auth-fails: ${SOCIAL_AUTH_FAIL_STARTUP:false}
    interactive-login-timeout-ms: ${SOCIAL_AUTH_INTERACTIVE_LOGIN_TIMEOUT_MS:300000}
    state-dir: ${SOCIAL_AUTH_STATE_DIR:./local/auth}
    x:
      enabled: ${SCRAPER_AUTH_X_ENABLED:true}
      login: ${X_LOGIN:}
      password: ${X_PASSWORD:}
      auth-state-path: ${X_AUTH_STATE_PATH:}
      authentication-required: true
      login-url: https://x.com/i/flow/login
      validation-url: https://x.com/home
    tiktok:
      enabled: ${SCRAPER_AUTH_TIKTOK_ENABLED:true}
      login: ${TIKTOK_LOGIN:}
      password: ${TIKTOK_PASSWORD:}
      auth-state-path: ${TIKTOK_AUTH_STATE_PATH:}
      authentication-required: true
      login-url: https://www.tiktok.com/login
      validation-url: https://www.tiktok.com/
    instagram:
      enabled: ${SCRAPER_AUTH_INSTAGRAM_ENABLED:true}
      login: ${INSTAGRAM_LOGIN:}
      password: ${INSTAGRAM_PASSWORD:}
      auth-state-path: ${INSTAGRAM_AUTH_STATE_PATH:}
      authentication-required: true
      login-url: https://www.instagram.com/accounts/login/
      validation-url: https://www.instagram.com/
    facebook:
      enabled: ${SCRAPER_AUTH_FACEBOOK_ENABLED:true}
      login: ${FACEBOOK_LOGIN:}
      password: ${FACEBOOK_PASSWORD:}
      auth-state-path: ${FACEBOOK_AUTH_STATE_PATH:}
      authentication-required: true
      login-url: https://www.facebook.com/login
      validation-url: https://www.facebook.com/
    threads:
      enabled: ${SCRAPER_AUTH_THREADS_ENABLED:true}
      login: ${THREADS_LOGIN:}
      password: ${THREADS_PASSWORD:}
      auth-state-path: ${THREADS_AUTH_STATE_PATH:}
      authentication-required: true
      login-url: https://www.threads.com/login
      validation-url: https://www.threads.com/
  default-time-zone: ${SCRAPER_DEFAULT_TIME_ZONE:Asia/Baku}
  scheduler:
    enabled: ${SCRAPER_SCHEDULER_ENABLED:true}
    cron: "${SCRAPER_SCHEDULER_CRON:0 */30 * * * *}"
    lookback-amount: ${SCRAPER_SCHEDULER_LOOKBACK_AMOUNT:1}
    lookback-unit: ${SCRAPER_SCHEDULER_LOOKBACK_UNIT:DAYS}
    max-jobs-per-run: ${SCRAPER_SCHEDULER_MAX_JOBS_PER_RUN:100}
    run-on-startup: ${SCRAPER_SCHEDULER_RUN_ON_STARTUP:false}
  daily:
    enabled: ${SCRAPER_DAILY_ENABLED:true}
    cron: "${SCRAPER_DAILY_CRON:0 0 3 * * *}"
    zone-id: ${SCRAPER_DAILY_ZONE_ID:Asia/Baku}
    max-jobs-per-run: ${SCRAPER_DAILY_MAX_JOBS_PER_RUN:100}
    run-on-startup: ${SCRAPER_DAILY_RUN_ON_STARTUP:false}
  engine:
    max-pages: ${SCRAPER_ENGINE_MAX_PAGES:10}
    max-posts: ${SCRAPER_ENGINE_MAX_POSTS:300}
    fail-on-unsupported-source: ${SCRAPER_ENGINE_FAIL_ON_UNSUPPORTED_SOURCE:true}
    normalize-urls: ${SCRAPER_ENGINE_NORMALIZE_URLS:true}
    remove-tracking-params: ${SCRAPER_ENGINE_REMOVE_TRACKING_PARAMS:true}
  browser:
    enabled: ${SCRAPER_BROWSER_ENABLED:true}
    headless: ${SCRAPER_BROWSER_HEADLESS:true}
    browser-type: ${SCRAPER_BROWSER_TYPE:CHROMIUM}
    executable-path: ${SCRAPER_BROWSER_EXECUTABLE_PATH:}
    launch-timeout-ms: ${SCRAPER_BROWSER_LAUNCH_TIMEOUT_MS:30000}
    navigation-timeout-ms: ${SCRAPER_BROWSER_NAVIGATION_TIMEOUT_MS:30000}
    action-timeout-ms: ${SCRAPER_BROWSER_ACTION_TIMEOUT_MS:10000}
    default-wait-ms: ${SCRAPER_BROWSER_DEFAULT_WAIT_MS:1000}
    viewport-width: ${SCRAPER_BROWSER_VIEWPORT_WIDTH:1366}
    viewport-height: ${SCRAPER_BROWSER_VIEWPORT_HEIGHT:768}
    user-agent: "${SCRAPER_BROWSER_USER_AGENT:Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36}"
    slow-mo-ms: ${SCRAPER_BROWSER_SLOW_MO_MS:0}
    max-scroll-attempts: ${SCRAPER_BROWSER_MAX_SCROLL_ATTEMPTS:10}
    scroll-delay-ms: ${SCRAPER_BROWSER_SCROLL_DELAY_MS:1000}
    install-browsers-on-startup: ${SCRAPER_BROWSER_INSTALL_BROWSERS_ON_STARTUP:false}
  x:
    enabled: ${SCRAPER_X_ENABLED:true}
    base-url: ${SCRAPER_X_BASE_URL:https://x.com}
    auth-state-path: ${X_AUTH_STATE_PATH:${SOCIAL_AUTH_STATE_DIR:./local/auth}/x-storage-state.json}
    login-url: ${SCRAPER_X_LOGIN_URL:https://x.com/i/flow/login}
    login-timeout-ms: ${SCRAPER_X_LOGIN_TIMEOUT_MS:60000}
    authentication-required: ${SCRAPER_X_AUTHENTICATION_REQUIRED:true}
    search-mode: ${SCRAPER_X_SEARCH_MODE:LATEST}
    include-retweets: ${SCRAPER_X_INCLUDE_RETWEETS:true}
    include-replies: ${SCRAPER_X_INCLUDE_REPLIES:true}
    include-promoted: ${SCRAPER_X_INCLUDE_PROMOTED:false}
    max-scroll-attempts: ${SCRAPER_X_MAX_SCROLL_ATTEMPTS:80}
    scroll-delay-ms: ${SCRAPER_X_SCROLL_DELAY_MS:1200}
    no-new-post-limit: ${SCRAPER_X_NO_NEW_POST_LIMIT:10}
    post-open-timeout-ms: ${SCRAPER_X_POST_OPEN_TIMEOUT_MS:15000}
    prefer-latest-tab: ${SCRAPER_X_PREFER_LATEST_TAB:true}
  facebook:
    enabled: ${SCRAPER_FACEBOOK_ENABLED:true}
    base-url: ${SCRAPER_FACEBOOK_BASE_URL:https://www.facebook.com/}
    auth-state-path: ${FACEBOOK_AUTH_STATE_PATH:${SOCIAL_AUTH_STATE_DIR:./local/auth}/facebook-storage-state.json}
    authentication-required: ${SCRAPER_FACEBOOK_AUTHENTICATION_REQUIRED:true}
    login-url: ${SCRAPER_FACEBOOK_LOGIN_URL:https://www.facebook.com/login}
    auth-verification-url: ${SCRAPER_FACEBOOK_AUTH_VERIFICATION_URL:https://www.facebook.com/}
    login-timeout-ms: ${SCRAPER_FACEBOOK_LOGIN_TIMEOUT_MS:60000}
    manual-verification-timeout-ms: ${SCRAPER_FACEBOOK_MANUAL_VERIFICATION_TIMEOUT_MS:300000}
    locale: ${SCRAPER_FACEBOOK_LOCALE:en-US}
    timezone-id: ${SCRAPER_FACEBOOK_TIMEZONE_ID:Asia/Baku}
    search-mode: ${SCRAPER_FACEBOOK_SEARCH_MODE:RECENT}
    max-scroll-attempts: ${SCRAPER_FACEBOOK_MAX_SCROLL_ATTEMPTS:80}
    no-new-post-limit: ${SCRAPER_FACEBOOK_NO_NEW_POST_LIMIT:10}
    scroll-delay-ms: ${SCRAPER_FACEBOOK_SCROLL_DELAY_MS:1400}
    include-sponsored: ${SCRAPER_FACEBOOK_INCLUDE_SPONSORED:false}
    include-reels: ${SCRAPER_FACEBOOK_INCLUDE_REELS:false}
    include-shared-posts: ${SCRAPER_FACEBOOK_INCLUDE_SHARED_POSTS:true}
    include-group-posts: ${SCRAPER_FACEBOOK_INCLUDE_GROUP_POSTS:true}
    include-page-posts: ${SCRAPER_FACEBOOK_INCLUDE_PAGE_POSTS:true}
    open-post-for-details: ${SCRAPER_FACEBOOK_OPEN_POST_FOR_DETAILS:true}
    action-delay-ms: ${SCRAPER_FACEBOOK_ACTION_DELAY_MS:500}
    article-open-delay-ms: ${SCRAPER_FACEBOOK_ARTICLE_OPEN_DELAY_MS:700}
    authentication-timeout-ms: ${SCRAPER_FACEBOOK_AUTHENTICATION_TIMEOUT_MS:60000}
    timeline-load-timeout-ms: ${SCRAPER_FACEBOOK_TIMELINE_LOAD_TIMEOUT_MS:20000}
  instagram:
    enabled: ${SCRAPER_INSTAGRAM_ENABLED:true}
    base-url: ${SCRAPER_INSTAGRAM_BASE_URL:https://www.instagram.com}
    auth-state-path: ${INSTAGRAM_AUTH_STATE_PATH:${SOCIAL_AUTH_STATE_DIR:./local/auth}/instagram-storage-state.json}
    authentication-required: ${SCRAPER_INSTAGRAM_AUTHENTICATION_REQUIRED:true}
    login-url: ${SCRAPER_INSTAGRAM_LOGIN_URL:https://www.instagram.com/accounts/login/}
    auth-verification-url: ${SCRAPER_INSTAGRAM_AUTH_VERIFICATION_URL:https://www.instagram.com/}
    login-timeout-ms: ${SCRAPER_INSTAGRAM_LOGIN_TIMEOUT_MS:60000}
    manual-verification-timeout-ms: ${SCRAPER_INSTAGRAM_MANUAL_VERIFICATION_TIMEOUT_MS:300000}
    locale: ${SCRAPER_INSTAGRAM_LOCALE:en-US}
    timezone-id: ${SCRAPER_INSTAGRAM_TIMEZONE_ID:Asia/Baku}
    search-mode: ${SCRAPER_INSTAGRAM_SEARCH_MODE:AUTO}
    max-scroll-attempts: ${SCRAPER_INSTAGRAM_MAX_SCROLL_ATTEMPTS:80}
    no-new-post-limit: ${SCRAPER_INSTAGRAM_NO_NEW_POST_LIMIT:10}
    max-candidates: ${SCRAPER_INSTAGRAM_MAX_CANDIDATES:1000}
    max-posts-per-run: ${SCRAPER_INSTAGRAM_MAX_POSTS_PER_RUN:300}
    max-post-link-scroll-attempts: ${SCRAPER_INSTAGRAM_MAX_POST_LINK_SCROLL_ATTEMPTS:30}
    max-run-duration-ms: ${SCRAPER_INSTAGRAM_MAX_RUN_DURATION_MS:3600000}
    max-carousel-items: ${SCRAPER_INSTAGRAM_MAX_CAROUSEL_ITEMS:20}
    scroll-delay-ms: ${SCRAPER_INSTAGRAM_SCROLL_DELAY_MS:1300}
    action-delay-ms: ${SCRAPER_INSTAGRAM_ACTION_DELAY_MS:500}
    post-open-timeout-ms: ${SCRAPER_INSTAGRAM_POST_OPEN_TIMEOUT_MS:15000}
    timeline-load-timeout-ms: ${SCRAPER_INSTAGRAM_TIMELINE_LOAD_TIMEOUT_MS:20000}
    include-reels: ${SCRAPER_INSTAGRAM_INCLUDE_REELS:false}
    include-sponsored: ${SCRAPER_INSTAGRAM_INCLUDE_SPONSORED:false}
    open-post-for-details: ${SCRAPER_INSTAGRAM_OPEN_POST_FOR_DETAILS:true}
  tiktok:
    enabled: ${SCRAPER_TIKTOK_ENABLED:true}
    base-url: ${SCRAPER_TIKTOK_BASE_URL:https://www.tiktok.com}
    auth-state-path: ${TIKTOK_AUTH_STATE_PATH:${SOCIAL_AUTH_STATE_DIR:./local/auth}/tiktok-storage-state.json}
    authentication-mode: ${SCRAPER_TIKTOK_AUTHENTICATION_MODE:AUTO}
    authentication-required: ${SCRAPER_TIKTOK_AUTHENTICATION_REQUIRED:false}
    login-url: ${SCRAPER_TIKTOK_LOGIN_URL:https://www.tiktok.com/login}
    auth-verification-url: ${SCRAPER_TIKTOK_AUTH_VERIFICATION_URL:https://www.tiktok.com/}
    login-timeout-ms: ${SCRAPER_TIKTOK_LOGIN_TIMEOUT_MS:60000}
    manual-verification-timeout-ms: ${SCRAPER_TIKTOK_MANUAL_VERIFICATION_TIMEOUT_MS:300000}
    locale: ${SCRAPER_TIKTOK_LOCALE:en-US}
    timezone-id: ${SCRAPER_TIKTOK_TIMEZONE_ID:Asia/Baku}
    allow-anonymous-fallback: ${SCRAPER_TIKTOK_ALLOW_ANONYMOUS_FALLBACK:true}
    search-mode: ${SCRAPER_TIKTOK_SEARCH_MODE:AUTO}
    navigation-timeout-ms: ${SCRAPER_TIKTOK_NAVIGATION_TIMEOUT_MS:30000}
    readiness-timeout-ms: ${SCRAPER_TIKTOK_READINESS_TIMEOUT_MS:20000}
    search-timeout-ms: ${SCRAPER_TIKTOK_SEARCH_TIMEOUT_MS:20000}
    post-open-timeout-ms: ${SCRAPER_TIKTOK_POST_OPEN_TIMEOUT_MS:20000}
    max-scroll-attempts: ${SCRAPER_TIKTOK_MAX_SCROLL_ATTEMPTS:80}
    no-new-post-limit: ${SCRAPER_TIKTOK_NO_NEW_POST_LIMIT:10}
    max-candidates: ${SCRAPER_TIKTOK_MAX_CANDIDATES:1000}
    action-delay-ms: ${SCRAPER_TIKTOK_ACTION_DELAY_MS:500}
    scroll-delay-ms: ${SCRAPER_TIKTOK_SCROLL_DELAY_MS:1300}
    open-post-for-details: ${SCRAPER_TIKTOK_OPEN_POST_FOR_DETAILS:true}
    include-sponsored: ${SCRAPER_TIKTOK_INCLUDE_SPONSORED:false}
    include-photo-posts: ${SCRAPER_TIKTOK_INCLUDE_PHOTO_POSTS:true}
  threads:
    enabled: ${SCRAPER_THREADS_ENABLED:true}
    base-url: ${SCRAPER_THREADS_BASE_URL:https://www.threads.com}
    auth-state-path: ${THREADS_AUTH_STATE_PATH:${SOCIAL_AUTH_STATE_DIR:./local/auth}/threads-storage-state.json}
    authentication-required: ${SCRAPER_THREADS_AUTHENTICATION_REQUIRED:false}
    locale: ${SCRAPER_THREADS_LOCALE:en-US}
    timezone-id: ${SCRAPER_THREADS_TIMEZONE_ID:Asia/Baku}
    max-scroll-attempts: ${SCRAPER_THREADS_MAX_SCROLL_ATTEMPTS:80}
    no-new-post-limit: ${SCRAPER_THREADS_NO_NEW_POST_LIMIT:10}
    max-candidates: ${SCRAPER_THREADS_MAX_CANDIDATES:1000}
    scroll-delay-ms: ${SCRAPER_THREADS_SCROLL_DELAY_MS:1300}
    action-delay-ms: ${SCRAPER_THREADS_ACTION_DELAY_MS:500}
    page-load-timeout-ms: ${SCRAPER_THREADS_PAGE_LOAD_TIMEOUT_MS:20000}
    include-replies: ${SCRAPER_THREADS_INCLUDE_REPLIES:false}
    include-reposts: ${SCRAPER_THREADS_INCLUDE_REPOSTS:false}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html
  packages-to-scan:
    - org.raul.javawebscarper.controller
  paths-to-match:
    - /api/**

logging:
  pattern:
    console: "${LOG_CONSOLE_PATTERN:%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{requestId:-system}] %logger{36} - %msg%n}"
  level:
    org.raul.javawebscarper: ${APP_LOG_LEVEL:INFO}
    org.flywaydb: ${FLYWAY_LOG_LEVEL:INFO}
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG_LEVEL:WARN}
    org.hibernate.orm.jdbc.bind: ${HIBERNATE_BIND_LOG_LEVEL:WARN}
