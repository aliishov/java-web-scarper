services:
  postgres:
    image: postgres:17-alpine
    container_name: java-web-scarper-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-scarper_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - scarper

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: java-web-scarper-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-scarper_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      SERVER_PORT: 8080
      SCRAPER_SCHEDULER_ENABLED: ${SCRAPER_SCHEDULER_ENABLED:-true}
      SCRAPER_SCHEDULER_MAX_JOBS_PER_RUN: ${SCRAPER_SCHEDULER_MAX_JOBS_PER_RUN:-100}
      SCRAPER_DAILY_ENABLED: ${SCRAPER_DAILY_ENABLED:-true}
      SCRAPER_DAILY_MAX_JOBS_PER_RUN: ${SCRAPER_DAILY_MAX_JOBS_PER_RUN:-100}
      SCRAPER_ENGINE_MAX_PAGES: ${SCRAPER_ENGINE_MAX_PAGES:-5}
      SCRAPER_ENGINE_MAX_POSTS: ${SCRAPER_ENGINE_MAX_POSTS:-100}
      SCRAPER_BROWSER_ENABLED: ${SCRAPER_BROWSER_ENABLED:-true}
      SCRAPER_X_ENABLED: ${SCRAPER_X_ENABLED:-true}
      X_AUTH_STATE_PATH: ${X_AUTH_STATE_PATH:-}
    ports:
      - '${APP_PORT:-8080}:8080'
    networks:
      - scarper

volumes:
  postgres_data:

networks:
  scarper:
    driver: bridge
